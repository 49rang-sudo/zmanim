# ---------------------------------------------------------------
#  לוח שנה — פריסה ל-VPS
#
#  הרצה:  docker compose up -d --build
#
#  האפליקציה מאזינה על 127.0.0.1:3000 בלבד. החשיפה לאינטרנט
#  נעשית דרך ה-Nginx של המארח (aaPanel) — ראו nginx/luach.conf.
# ---------------------------------------------------------------

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?חובה להגדיר POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-luach}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # לא נחשף החוצה — רק שירותים ברשת הפנימית מגיעים אליו
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luach}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?חובה להגדיר S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?חובה להגדיר S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    ports:
      # קונסולת הניהול — מוגבלת ל-localhost, ניגשים דרך מנהרת SSH
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # יוצר את הדלי פעם אחת ומסיים
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-luach-artwork}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      echo 'הדלי מוכן'
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-luach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-luach}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?חובה להגדיר AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?חובה להגדיר AUTH_URL}
      AUTH_TRUST_HOST: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-luach-artwork}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?חובה להגדיר PAYMENT_WEBHOOK_SECRET}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sumit}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?חובה להגדיר NEXT_PUBLIC_BASE_URL}
      SLOT_HOLD_MINUTES: ${SLOT_HOLD_MINUTES:-45}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-60}
    ports:
      # רק לולאה מקומית — Nginx של המארח מגשר פנימה
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  minio-data:
