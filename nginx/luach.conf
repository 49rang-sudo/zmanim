# ---------------------------------------------------------------
#  Nginx — אתר מול האפליקציה שרצה ב-docker compose
#
#  ב-aaPanel: אתרים → הוספת אתר → הגדרות → קובץ תצורה,
#  והדביקו את הבלוקים הרלוונטיים. את תעודת ה-SSL הוציאו
#  דרך aaPanel (Let's Encrypt) לפני הפעלת הבלוק המוצפן.
# ---------------------------------------------------------------

server {
    listen 80;
    server_name luach.example.com;

    # כל התעבורה עוברת ל-HTTPS, חוץ מאימות התעודה
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name luach.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # --- כותרות אבטחה ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- קבצי אמנות כבדים ---
    # חייב להיות גדול מ-MAX_UPLOAD_MB, אחרת Nginx חוסם את
    # ההעלאה לפני שהיא בכלל מגיעה לאפליקציה
    client_max_body_size 80m;
    client_body_timeout  300s;

    # --- העברה לאפליקציה ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # בלי זה Auth.js בונה כתובות חזרה עם http ושובר את ההתחברות
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    # נכסים בנויים — שם הקובץ מכיל חתימה, אפשר מטמון ארוך
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # לוח הניהול לא נכנס לשום מטמון
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
